name: Security Scan

on:
  pull_request:

jobs:
  grype-security-scan:
    runs-on: ubuntu-latest
    name: Grype
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Security Scan
        id: grype-scan
        uses: anchore/scan-action@7037fa011853d5a11690026fb85feee79f4c946c # v7.3.2
        with:
          path: "."
          fail-build: true
          only-fixed: true
          severity-cutoff: "high"
          output-format: "table"
